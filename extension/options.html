<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ShrinkTo Pro - License &amp; Settings</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: auto; max-width: 560px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 20px; margin: 8px 0 20px; letter-spacing: -0.02em; }
    .card { border: 1px solid var(--border-light); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; margin-bottom: 10px; }
    .kv { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border-light); }
    .kv:last-of-type { border-bottom: none; }
    .kv span:first-child { color: var(--text-3); }
    .badge { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge.on { background: var(--green-light); color: var(--green); }
    .badge.off { background: #fce8e6; color: var(--red); }
    .danger { margin-top: 12px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--red); font-weight: 600; cursor: pointer; }
    .danger:hover { border-color: var(--red); background: #fff5f5; }
    label.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--text-2); cursor: pointer; }
    label.check input { margin-top: 3px; }
    .hint { font-size: 12px; color: var(--text-3); margin-top: 6px; }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <header class="top" style="padding-inline: 0;">
    <div class="brand"><span class="mark">✦</span><span class="name">ShrinkTo <em>Pro</em></span></div>
  </header>
  <h1>License &amp; settings</h1>

  <div class="card">
    <h2>License</h2>
    <div class="kv"><span>Status</span><span id="status" class="badge off">Not activated</span></div>
    <div class="kv"><span>Key</span><span id="key">—</span></div>
    <div class="kv"><span>Activated</span><span id="activated">—</span></div>
    <div class="kv"><span>Mode</span><span id="mode">—</span></div>
    <button id="deactivate" class="danger" hidden>Deactivate on this browser</button>
    <p class="hint">Deactivating frees one seat so you can use the key on another browser.</p>
  </div>

  <div class="card">
    <h2>Developer</h2>
    <label class="check">
      <input type="checkbox" id="testMode" />
      <span>Use Dodo Payments <strong>test mode</strong> for activation (test.dodopayments.com). Only for trying the flow with test-mode license keys before going live.</span>
    </label>
  </div>

  <p class="hint">Need help? <a href="https://shrinkto.com/contact" target="_blank" rel="noopener">Contact support</a> · <a href="https://shrinkto.com" target="_blank" rel="noopener">shrinkto.com</a></p>

  <script type="module" src="options.js"></script>
</body>
</html>
